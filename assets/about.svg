<rect x="24" y="20" width="852" height="160" rx="26" fill="url(#fill)" stroke="url(#edge)" stroke-width="1.5"/><rect x="50" y="21" width="800" height="1.5" fill="url(#shine)"/><text x="450" y="76" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="17" font-weight="500" letter-spacing="0" fill="#eef0ff">I am a peaceful person who does no harm to anyone, is married, happy and has children.</text><text x="450" y="110" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="17" font-weight="500" letter-spacing="0" fill="#eef0ff">All of my work is for hobby purposes and I do not have a commercial purpose.</text><text x="450" y="144" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="17" font-weight="500" letter-spacing="0" fill="#eef0ff">I update my current projects and work on new projects whenever I get the chance.</text>
