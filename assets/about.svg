<rect x="40" y="30" width="820" height="190" rx="32" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
<rect x="42.5" y="32.5" width="815" height="185" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".07"/>
<rect x="72" y="30.4" width="756" height="1.6" fill="url(#shine)"/>
<text x="450" y="98" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="17" font-weight="500" letter-spacing="0" fill="#f4f2ff" style="paint-order:stroke" stroke="#0a0d1f" stroke-opacity=".25" stroke-width="3">I am a peaceful person who does no harm to anyone, is married, happy and has children.</text><text x="450" y="134" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="17" font-weight="500" letter-spacing="0" fill="#f4f2ff" style="paint-order:stroke" stroke="#0a0d1f" stroke-opacity=".25" stroke-width="3">All of my work is for hobby purposes and I do not have a commercial purpose.</text><text x="450" y="170" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="17" font-weight="500" letter-spacing="0" fill="#f4f2ff" style="paint-order:stroke" stroke="#0a0d1f" stroke-opacity=".25" stroke-width="3">I update my current projects and work on new projects whenever I get the chance.</text>
</svg>
