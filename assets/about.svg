<clipPath id="p"><rect x="40" y="30" width="820" height="190" rx="32"/></clipPath>
<filter id="bs" filterUnits="userSpaceOnUse" x="-120" y="-120" width="1140" height="490"><feGaussianBlur stdDeviation="11"/></filter>
